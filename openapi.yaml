openapi: 3.0.3
info:
  title: API Mesa de Ayuda
  version: 0.1.0
  description: >
    API académica de tickets. Actualmente utiliza almacenamiento
    en memoria. La autenticación Firebase está pendiente.
servers:
  - url: http://localhost:3000
paths:
  /api/tickets:
    get:
      summary: Listar tickets
      responses:
        '200':
          description: Consulta exitosa
    post:
      summary: Crear ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearTicket'
      responses:
        '201':
          description: Ticket creado
        '400':
          description: Datos inválidos
  /api/tickets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Consultar ticket por identificador
      responses:
        '200':
          description: Ticket encontrado
        '404':
          description: Ticket inexistente
    patch:
      summary: Cambiar estado del ticket
      description: >
        Control provisional de roles. El rol proviene de la petición
        y no constituye autorización segura.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado, rol]
              properties:
                estado:
                  type: string
                  enum: [Abierto, En curso, Resuelto, Cerrado]
                rol:
                  type: string
                  enum: [usuario, agente, admin]
      responses:
        '200':
          description: Estado actualizado
        '400':
          description: Datos inválidos
        '403':
          description: Rol sin permiso
        '404':
          description: Ticket inexistente
        '409':
          description: Transición de estado inválida
  /api/tickets/{id}/mensajes:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Agregar mensaje al ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [texto, autorRol]
              properties:
                texto:
                  type: string
                  minLength: 1
                  maxLength: 1000
                autorRol:
                  type: string
                  enum: [usuario, agente, admin]
      responses:
        '200':
          description: Mensaje agregado
        '400':
          description: Datos inválidos
        '404':
          description: Ticket inexistente
components:
  schemas:
    CrearTicket:
      type: object
      required:
        - asunto
        - descripcion
        - prioridad
        - solicitanteNombre
      properties:
        asunto:
          type: string
          minLength: 5
          maxLength: 120
        descripcion:
          type: string
          minLength: 10
          maxLength: 2000
        prioridad:
          type: string
          enum: [Baja, Media, Alta, Urgente]
        solicitanteNombre:
          type: string
          minLength: 3
          maxLength: 80
